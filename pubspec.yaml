name: campus_connect
description: Campus Connect – City University Malaysia Student App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.0.0
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  provider: ^6.0.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.0
  file_picker: ^8.1.7
  image_picker: ^1.1.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
